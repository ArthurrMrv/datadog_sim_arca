# Online Boutique from a pinned release (Phase 1): pinning is what makes experiments reproducible.
# VERIFY(docs/verified.md V2): the tracing env vars and which services are instrumented in this release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/v0.10.2/release/kubernetes-manifests.yaml

labels:
  - includeSelectors: false
    pairs:
      env: rca-sim

# Phase 1.3 asked for requests and limits on every service, so that CPU and memory stress faults
# saturate something observable instead of eating an unbounded budget. Verified 2026-09-20: release
# v0.10.2 already sets both on all 12 containers, and they are tuned per runtime -- adservice (JVM)
# gets 300Mi and recommendationservice (Python) 450Mi against 128Mi for the Go services. Flattening
# them to one value OOM-kills those two on startup, so upstream's values are kept as they are.

patches:
  - path: frontend-nodeport.yaml

  # Tracing to the OTel Collector. Matches frontend and every *service deployment; redis-cart and
  # loadgenerator are not instrumented and are left alone.
  - target:
      kind: Deployment
      name: (frontend|.*service)
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.observability.svc.cluster.local:4317
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://otel-collector.observability.svc.cluster.local:4317
                  # Without this the SDKs fall back to `unknown_service` /
                  # `unknown_service:<binary>`, so spanmetrics lumps those services into one
                  # meaningless component that never joins with `kube_deployment` -- and PRISM
                  # cannot pair a service's internal and external properties, which is the whole
                  # distinction it ranks on. Taken from the pod's own `app` label, so one patch
                  # serves all ten instrumented services.
                  - name: OTEL_SERVICE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['app']

  # Steady, moderate load: a stable baseline is what makes an anomaly detectable at all.
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
      spec:
        template:
          spec:
            containers:
              - name: main
                env:
                  - name: USERS
                    value: "10"
                  - name: RATE
                    value: "5"
