# Optional (D7): all-in-one Jaeger for reading individual traces while debugging a fault. Nothing in the
# RCA pipeline depends on it; the Collector drops traces silently if it is absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: {app: jaeger, env: rca-sim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger, env: rca-sim}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {containerPort: 4317}
            - {containerPort: 16686}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels: {app: jaeger, env: rca-sim}
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: ui, port: 16686, targetPort: 16686}
