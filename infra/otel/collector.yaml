# OTel Collector config (Phase 3): traces in, spanmetrics out as ordinary Datadog metrics (D6).
# Mounted as a ConfigMap by infra/otel/deployment.yaml.
# VERIFY(docs/verified.md V5): the resulting metric names and their namespace prefix for this Collector
# version, then write them into rca-service/app/adapter/queries.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  spanmetrics:
    # Verified against the connector README (docs/verified.md V5): every metric already carries
    # service.name, span.name, span.kind, status.code and collector.instance.id, so those are NOT
    # declared here -- they are defaults.
    #
    # Cardinality is the one real risk of this design, and `span.name` is where it bites: one series
    # per operation per service per status, times every histogram bucket. The adapter groups by
    # service only, so the operation dimension buys nothing and is dropped. collector.instance.id
    # exists for multi-collector deployments; there is one Collector here.
    exclude_dimensions: [span.name, collector.instance.id]
    histogram:
      # Pinned, because the default is changing: the connector still emits ms, but a feature gate
      # switches it to s to follow OpenTelemetry semantic conventions. An unpinned unit would silently
      # turn a 0.5s monitor threshold into 0.5ms on a Collector upgrade, and it would fire forever.
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms]
    # Datadog counts are deltas. Cumulative would make the Agent diff the series itself and emit a
    # spike on every Collector restart, which reads exactly like an incident.
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    # Match the Agent's 5s collection so trace metrics line up with container metrics on one grid (D8).
    metrics_flush_interval: 5s
    # This is also the connector's default, set explicitly so the metric names the adapter queries
    # cannot move under a version bump.
    namespace: traces.span.metrics

processors:
  batch:
    timeout: 5s

exporters:
  # Single egress point: the Agent already holds the API key.
  #
  # The Service is named after the Helm release, which up.sh installs as `datadog` -- so
  # `datadog.datadog.svc.cluster.local`, NOT `datadog-agent...`. Verified 2026-09-20 against a running
  # cluster (docs/verified.md): that Service exposes 4317/TCP and 4318/TCP, and the Agent reports
  # `OTLP: Status: Enabled, Collector status: Running`. A name that does not resolve fails as
  # `name resolver error: produced zero addresses` and no trace metric ever reaches Datadog.
  otlp/datadog-agent:
    endpoint: datadog.datadog.svc.cluster.local:4317
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      level: basic
  pipelines:
    traces:
      # spanmetrics only. Jaeger (D7) is off by default, so exporting to it would mean an exporter with
      # no target: its queue fills, the errors propagate back to the receiver, and the instrumented
      # services start retrying their OTLP exports. To enable D7, add an `otlp/jaeger` exporter here
      # AND deploy it with DEPLOY_JAEGER=1 -- one without the other breaks the trace path.
      receivers: [otlp]
      exporters: [spanmetrics]
    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [otlp/datadog-agent]
