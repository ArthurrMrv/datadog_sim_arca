# Collector deployment (Phase 3). The config comes from the ConfigMap generated by up.sh out of
# infra/otel/collector.yaml, so that file stays the single source of truth.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    env: rca-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels: {app: otel-collector, env: rca-sim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector, env: rca-sim}
    spec:
      containers:
        - name: collector
          # VERIFY(docs/verified.md V5): pinned version; spanmetrics metric names depend on it.
          image: otel/opentelemetry-collector-contrib:0.107.0
          args: ["--config=/conf/collector.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          volumeMounts:
            - {name: config, mountPath: /conf}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels: {app: otel-collector, env: rca-sim}
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
